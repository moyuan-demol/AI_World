services:
  backend:
    build:
      context: ./backend
    container_name: ai-world-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/database.db
      UPLOAD_DIR: /app/data/uploads
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: ai-world-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped
